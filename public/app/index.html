<!DOCTYPE html>

<head>

<header class="nav">
  <div class="wrap nav__inner">
    <a class="brand" href="index.html">
      <span class="brand__logo">🦍</span>
      <span class="brand__name">オゴリ <span class="brand__en">APP</span></span>

    <div class="nav__spacer"></div>
    <nav class="nav__links">
      <a class="btn btn--sm btn--ghost" href="admin.html">企業管理</a>

      <a class="btn btn--sm btn--ghost nav__home" href="../index.html">サービス紹介 ↗</a>
    </nav>

</header>

<main class="wrap app-main">
  <section class="launcher">
    <div class="launcher__head">
      <p class="eyebrow">オゴリ アプリ</p>
      <h1>ご利用の種類を選んでください</h1>
      <p class="muted">福利厚生プラットフォーム「オゴリ」の管理・利用画面です。</p>
    </div>
    <div class="launcher__grid">
      <a class="launch-card launch-card--admin" href="admin.html">
        <div class="launch-card__art"><img src="../assets/gori-salute.png" alt="ゴリ" /></div>
        <div class="launch-card__body">
          <span class="launch-card__tag">企業ご担当者さま</span>
          <h2>企業管理コンソール</h2>
          <p>会社IDの発行、社員の登録・管理、配送スケジュールや月額費用の確認ができます。</p>
          <span class="launch-card__cta">管理コンソールを開く →</span>
        </div>
      </a>
      <a class="launch-card launch-card--emp" href="employee.html">
        <div class="launch-card__art"><img src="../assets/gori-hero.png" alt="ゴリ" /></div>
        <div class="launch-card__body">
          <span class="launch-card__tag">社員さま</span>
          <h2>社員ポータル</h2>
          <p>会社ID・社員コード・PINでログイン。お届け先の登録や配送スケジュールの確認ができます。</p>
          <span class="launch-card__cta">ポータルを開く →</span>
        </div>

  </div>
