name: Publish static preview to gh-pages

# public/ を gh-pages ブランチへ公開する（Pages API を使わず push のみ）。
# 初回だけ Settings → Pages で「Deploy from a branch: gh-pages / (root)」を選択してください。
# 以降はこのワークフローが gh-pages を自動更新します。

on:
  push:
    branches:
      - claude/company-id-welfare-platform-lzu8ki
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish public/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SITE="$RUNNER_TEMP/site"
          rm -rf "$SITE"
          cp -r public "$SITE"
          touch "$SITE/.nojekyll"   # Jekyll 処理を無効化
          cd "$SITE"
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy static preview from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
