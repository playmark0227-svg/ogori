name: Deploy static preview to GitHub Pages

# public/ をそのまま GitHub Pages に公開する。
# 静的モード（サーバー無し）でブラウザ内データにより全画面をプレビューできる。

on:
  push:
    branches:
      - claude/company-id-welfare-platform-lzu8ki
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは1つに制限（進行中のものは完了させる）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # ※ 初回のみ、リポジトリの Settings → Pages で
        #   「Build and deployment > Source: GitHub Actions」を選択してください。
        #   （Actions のトークンでは Pages を自動有効化できないため一度だけ手動設定が必要）

      - name: Upload artifact (public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
